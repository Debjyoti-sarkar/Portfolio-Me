name: Supabase keep-alive

# Free-tier Supabase projects pause after 7 days without activity.
# A tiny read every 3 days keeps the database awake. Costs nothing.
on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' }}
    steps:
      - name: Query a public table
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/skills?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Accept-Profile: portfolio")
          echo "HTTP $status"
          test "$status" = "200"
