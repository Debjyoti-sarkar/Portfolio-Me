name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  build-e2e:
    name: Build & end-to-end tests (local Supabase)
    runs-on: ubuntu-latest
    needs: quality
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-admin-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (migrations + seed)
        # The CLI health-checks PostgREST before applying migrations, but the
        # exposed `portfolio` schema only exists after them, so skip that check
        # and reload PostgREST's schema cache once migrations have run.
        run: |
          supabase start -x vector,logflare,imgproxy,studio,mailpit --ignore-health-check
          supabase db query --local "notify pgrst, 'reload schema'"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:54321/rest/v1/ -o /dev/null && break; sleep 2
          done

      - name: Export Supabase env
        run: |
          supabase status -o env > /tmp/sb.env
          source /tmp/sb.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"

      - name: Generated types are up to date
        run: |
          npm run db:types
          git diff --exit-code src/lib/supabase/database.types.ts

      - name: Serve portfolio-contact Edge Function
        run: |
          printf 'PORTFOLIO_ALLOWED_ORIGINS=http://localhost:3000\nPORTFOLIO_RATE_LIMIT_SALT=ci-salt\nPORTFOLIO_RATE_LIMIT_MAX=1000\n' > supabase/functions/.env
          supabase functions serve --env-file supabase/functions/.env > /tmp/functions.log 2>&1 &

      - name: Create admin user
        run: npx tsx scripts/create-admin.ts

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            /tmp/functions.log
          retention-days: 7
